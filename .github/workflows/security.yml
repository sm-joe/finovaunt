name: Finovaunt Security Pipeline

on:
  workflow_call:
    inputs:
      backend_changed:
        description: Backend Files Changed
        required: true
        type: boolean
      frontend_changed:
        description: Frontend Files Changed
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: finovaunt-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret_scan:
    name: Secret Scanning
    if: inputs.backend_changed || inputs.frontend_changed || inputs.pipeline_changed
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend_security:
    name: Dependency Vulnerability Checks
    if: inputs.backend_changed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up UV
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Export Production Python Dependencies
        shell: bash
        run: |
          uv export \
            --format requirements-txt \
            --no-dev \
            --no-emit-project \
            --output-file "$RUNNER_TEMP/finovaunt-requirements.txt"

      - name: Audit Python Dependencies
        run: uvx pip-audit -r "$RUNNER_TEMP/finovaunt-requirements.txt"

      - name: Scan backend Dockerfile configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scan-type: config
          scan-ref: Dockerfile
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  frontend_security:
    name: Frontend Dependency and Dockerfile Security
    if: inputs.frontend_changed
    runs-on: ubuntu-latest

    steps:

      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Locked Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Scan frontend Dockerfile configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scan-type: config
          scan-ref: frontend/Dockerfile
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  filesystem:
    name: Trivy Filesystem and Configuration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Scan Source, Dependencies, Secrets and IaC Configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
