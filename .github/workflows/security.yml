name: Finovaunt Security Pipeline

on:
  workflow_call:
    inputs:
      backend_changed:
        description: Backend Files Changed
        required: true
        type: boolean

      frontend_changed:
        description: Frontend Files Changed
        required: true
        type: boolean

      pipeline_changed:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: finovaunt-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret_scan:
    name: Secret Scanning
    if: inputs.backend_changed || inputs.frontend_changed || inputs.pipeline_changed
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend_security:
    name: Dependency Vulnerability Checks
    if: inputs.backend_changed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up UV
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Export Production Python Dependencies
        shell: bash
        run: |
          uv export \
            --format requirements-txt \
            --no-dev \
            --no-emit-project \
            --output-file "$RUNNER_TEMP/finovaunt-requirements.txt"

      - name: Audit Python Dependencies
        run: uvx pip-audit -r "$RUNNER_TEMP/finovaunt-requirements.txt"

  backend_container_security:
    name: API Dockerfile Security
    if: inputs.backend_changed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Scan backend Dockerfile configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scan-type: config
          scan-ref: Dockerfile
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  frontend_security:
    name: Frontend Dependency and Dockerfile Security
    if: inputs.frontend_changed
    runs-on: ubuntu-latest

    steps:

      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Locked Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend_container_security:
    name: Dashboard Dockerfile Security
    if: inputs.frontend_changed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Scan frontend Dockerfile configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scan-type: config
          scan-ref: frontend/Dockerfile
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  filesystem:
    name: Trivy Filesystem and Configuration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Scan Source, Dependencies, Secrets and IaC Configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: "v0.75.0"
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table


  security_gate:
    name: Security Gate
    needs:
      - secret_scan
      - backend_security
      - backend_container_security
      - frontend_security
      - frontend_container_security
      - filesystem
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate security checks
        shell: bash
        env:
          BACKEND_CHANGED: ${{ inputs.backend_changed }}
          FRONTEND_CHANGED: ${{ inputs.frontend_changed }}
          PIPELINE_CHANGED: ${{ inputs.pipeline_changed }}

          SECRET_SCAN_RESULT: ${{ needs.secret_scan.result }}
          BACKEND_SECURITY_RESULT: ${{ needs.backend_security.result }}
          BACKEND_CONTAINER_RESULT: ${{ needs.backend_container_security.result }}
          FRONTEND_SECURITY_RESULT: ${{ needs.frontend_security.result }}
          FRONTEND_CONTAINER_RESULT: ${{ needs.frontend_container_security.result }}
          FILESYSTEM_RESULT: ${{ needs.filesystem.result }}
        run: |
          set -euo pipefail

          failed=0

          check_required() {
            local name="$1"
            local result="$2"

            echo "$name: $result"

            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          }

          if [[ "$BACKEND_CHANGED" == "true" ||
                "$FRONTEND_CHANGED" == "true" ||
                "$PIPELINE_CHANGED" == "true" ]]; then
            check_required "Secret Scanning" "$SECRET_SCAN_RESULT"
          fi

          if [[ "$BACKEND_CHANGED" == "true" ]]; then
            check_required "Dependency Vulnerability Checks" "$BACKEND_SECURITY_RESULT"
            check_required "API Dockerfile Security" "$BACKEND_CONTAINER_RESULT"
          fi

          if [[ "$FRONTEND_CHANGED" == "true" ]]; then
            check_required "Frontend Dependency Security" "$FRONTEND_SECURITY_RESULT"
            check_required "Dashboard Dockerfile Security" "$FRONTEND_CONTAINER_RESULT"
          fi

          check_required "Trivy Filesystem and Configuration Scan" "$FILESYSTEM_RESULT"

          if [[ "$failed" -ne 0 ]]; then
            echo "Security Gate failed."
            exit 1
          fi

          echo "All applicable security checks passed."