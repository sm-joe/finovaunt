name: Finovaunt CI Pipeline

on:
  workflow_call:
    inputs:
      backend_changed:
        description: Backend Files Changed
        required: true
        type: boolean

      frontend_changed:
        description: Frontend Files Changed
        required: true
        type: boolean
        
      pipeline_changed:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: finovaunt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend_ci:
    name: Backend Tests
    if: inputs.backend_changed || inputs.pipeline_changed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:

      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up UV
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Project and Development Dependencies
        run: uv sync --dev

      - name: Compile Python Source and Tests
        run: uv run python -m compileall -q src scripts tests

      - name: Run Backend Tests
        run: uv run python -m pytest -q

  frontend_ci:
    name: Frontend Build
    if: inputs.frontend_changed || inputs.pipeline_changed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Locked Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  compose:
    name: Validate Docker Compose Configuration
    env:
      FINOVAUNT_GITHUB_TOKEN: ${{ secrets.FINOVAUNT_GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Validate Compose Configuration
        run: docker compose config --quiet
