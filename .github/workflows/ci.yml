name: Finovaunt CI Pipeline

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: finovaunt-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python Compile and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up UV
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Project and Development Dependencies
        run: uv sync --dev

      - name: Compile Python Source and Tests
        run: uv run python -m compileall -q src scripts tests

      - name: Run Test Suite
        run: uv run pytest -q

  frontend:
    name: Frontend Type-check and Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Locked Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  compose:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Validate Compose Configuration
        run: docker compose config --quiet
