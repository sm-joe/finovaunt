name: Finovaunt Product CI

# Release-hardening gates: validate code, scan dependencies/secrets,
# and build both distribution images on PRs and main pushes.
# Container publication remains a separate release-only action.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: finovaunt-product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-ci:
    name: Backend, Frontend and Compose Validation
    uses: ./.github/workflows/ci.yml
    with:
      backend_changed: true
      frontend_changed: true
      pipeline_changed: true

  security:
    name: Dependency, Secret and Container Security
    uses: ./.github/workflows/security.yml
    with:
      backend_changed: true
      frontend_changed: true
      pipeline_changed: true

  container-build:
    name: Build API and Dashboard Images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Repository
        uses: actions/checkout@v7

      - name: Build Python API Image
        run: docker build --pull --tag finovaunt-api:ci --file Dockerfile .

      - name: Build React Dashboard Image
        run: docker build --pull --tag finovaunt-dashboard:ci --file frontend/Dockerfile frontend

      - name: Inspect Built Images
        run: |
          docker image inspect finovaunt-api:ci --format '{{.Id}}'
          docker image inspect finovaunt-dashboard:ci --format '{{.Id}}'

  compose-runtime-smoke:
    name: Boot API and Dashboard on Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FINOVAUNT_BOOTSTRAP_PASSWORD: ci-runtime-bootstrap-pass-2026
    steps:
      - name: Check out Repository
        uses: actions/checkout@v7

      - name: Boot Containers with Empty Persistent State
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data artifacts-live
          docker compose up -d --build
          docker compose ps

      - name: Check API Health and Frontend HTTP
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/api/health >/tmp/finovaunt-health.json; then
              break
            fi
            sleep 2
          done
          python -c 'import json; d=json.load(open("/tmp/finovaunt-health.json")); assert d.get("status") == "ok" or d.get("read_only") is True'
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/tmp/finovaunt-frontend.html
          grep -qi '<html' /tmp/finovaunt-frontend.html

      - name: Persist Administrator and Collector Configuration
        run: python scripts/acceptance_state_upgrade.py prepare

      - name: Restart Containers Without Clearing Persistent Data
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --force-recreate api frontend

      - name: Verify Persisted State After Container Restart
        run: python scripts/acceptance_state_upgrade.py verify

      - name: Install Chromium Browser Acceptance Runner
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/finovaunt-browser-venv
          /tmp/finovaunt-browser-venv/bin/pip install --disable-pip-version-check 'playwright==1.58.0'
          /tmp/finovaunt-browser-venv/bin/python -m playwright install --with-deps chromium

      - name: Exercise Login Dashboard Accounts Profile Logout In Chromium
        shell: bash
        run: |
          set -euo pipefail
          /tmp/finovaunt-browser-venv/bin/python scripts/acceptance_browser.py

      - name: Verify Backup Integrity Of Persisted State
        shell: bash
        run: |
          set -euo pipefail
          docker compose stop api frontend
          sudo -n python scripts/control_backup.py backup "$RUNNER_TEMP/finovaunt-state.tar.gz"
          sudo -n python scripts/control_backup.py verify "$RUNNER_TEMP/finovaunt-state.tar.gz"

      - name: Inspect Container Status on Failure
        if: failure()
        run: docker compose logs --tail=120 api frontend init-data

      - name: Shut Down Test Containers
        if: always()
        run: docker compose down
