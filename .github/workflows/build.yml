name: Finovaunt Product CI

# TEMPORARY DEVELOPMENT MODE (M1-M6):
# Security audits, container builds and GHCR publication are disabled on
# pushes and PRs. Restore the full release gates before stable v1.0.0.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: finovaunt-product-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-ci:
    name: Backend, Frontend and Compose Validation
    uses: ./.github/workflows/ci.yml
    with:
      backend_changed: true
      frontend_changed: true
      pipeline_changed: true
