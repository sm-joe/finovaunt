name: Finovaunt Docker Build Pipeline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finovaunt-docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Required CI Gate
    uses: ./.github/workflows/ci.yml

  security:
    name: Required Security Gate
    needs: ci
    uses: ./.github/workflows/security.yml

  build-api:
    name: Build and Publish API Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security

    permissions:
      contents: read
      packages: write

    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize Image Owner
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish API Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/finovaunt-api:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/finovaunt-api:latest
          cache-from: type=gha,scope=finovaunt-api
          cache-to: type=gha,mode=max,scope=finovaunt-api

  build-frontend:
    name: Build and Publish Dashboard Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security

    permissions:
      contents: read
      packages: write

    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Normalize image owner
        id: image
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Dashboard Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/finovaunt-dashboard:${{ github.sha }}
            ghcr.io/${{ steps.image.outputs.owner }}/finovaunt-dashboard:latest
          cache-from: type=gha,scope=finovaunt-dashboard
          cache-to: type=gha,mode=max,scope=finovaunt-dashboard
