[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "autonomous-finops-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2.60,<2.0", "pydantic>=2.9,<3.0", "PyYAML>=6.0.2,<7.0", "python-dotenv>=1.0.1,<2.0", "boto3>=1.35,<2.0"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "ruff>=0.8,<1.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
