server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Serve the React SPA at the same origin. No redirects to port 8080.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Authentication endpoints must be reachable before a session exists.
    location = /api/auth/login { proxy_pass http://api:8787; proxy_set_header Host $host; proxy_set_header Cookie $http_cookie; }
    location = /api/auth/logout { proxy_pass http://api:8787; proxy_set_header Host $host; proxy_set_header Cookie $http_cookie; }
    location = /api/auth/password { proxy_pass http://api:8787; proxy_set_header Host $host; proxy_set_header Cookie $http_cookie; }
    location = /api/auth/session { proxy_pass http://api:8787; proxy_set_header Host $host; proxy_set_header Cookie $http_cookie; }
    location = /api/health { proxy_pass http://api:8787; proxy_set_header Host $host; }
    location = /api/sync-status { proxy_pass http://api:8787; proxy_set_header Host $host; proxy_set_header Cookie $http_cookie; }

    # The API enforces session and first-password-change requirements itself.
    # AWS Describe pagination may exceed nginx default 60-second response timeout.
    # Keep this limited to collection endpoints rather than all API requests.
    location = /api/inventory-scans {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location = /api/billing-scans {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
