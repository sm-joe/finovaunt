services:
  # One-shot permission repair for existing bind-mounted data, including
  # control-plane.json.tmp left behind by a previous root-owned deployment.
  # The API itself remains permanently non-root.
  init-data:
    image: ghcr.io/sm-joe/finovaunt-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /app/data
        chown -R 10001:10001 /app/data
        echo "Finovaunt control-plane directory ownership prepared for UID 10001."
    volumes:
      - ./data:/app/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    restart: "no"

  api:
    depends_on:
      init-data:
        condition: service_completed_successfully
    image: ghcr.io/sm-joe/finovaunt-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FINOVAUNT_API_HOST: 0.0.0.0
      FINOVAUNT_API_PORT: "8787"
      FINOVAUNT_BOOTSTRAP_PASSWORD: ${FINOVAUNT_BOOTSTRAP_PASSWORD:?Set a unique initial administrator password with at least 12 characters}
      FINOVAUNT_GITHUB_REPOSITORY: sm-joe/finovaunt
      FINOVAUNT_SCAN_WORKFLOW: finovaunt-scan.yml
      FINOPS_OUTPUT_DIR: artifacts-live
      FINOVAUNT_GITHUB_TOKEN: ${FINOVAUNT_GITHUB_TOKEN:-}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./artifacts-live:/app/artifacts-live
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    image: ghcr.io/sm-joe/finovaunt-dashboard:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NGINX_ENVSUBST_ON_TEMPLATES_DIR: /dev/null
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=4m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped