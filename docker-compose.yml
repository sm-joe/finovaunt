services:
  api:
    image: finovaunt-api:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FINOVAUNT_API_HOST: 0.0.0.0
      FINOVAUNT_API_PORT: "8787"
      FINOVAUNT_GITHUB_REPOSITORY: sm-joe/finovaunt
      FINOVAUNT_SCAN_WORKFLOW: finovaunt-scan.yml
      FINOPS_OUTPUT_DIR: artifacts-live
      FINOVAUNT_GITHUB_TOKEN: ${FINOVAUNT_GITHUB_TOKEN:?Set FINOVAUNT_GITHUB_TOKEN in .env}
      AWS_PROFILE: default
      AWS_CONFIG_FILE: /aws/config
      AWS_SHARED_CREDENTIALS_FILE: /aws/credentials
      AWS_SDK_LOAD_CONFIG: "1"
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./artifacts-live:/app/artifacts-live
      - ./data:/app/data
      - "${USERPROFILE}/.aws:/aws:ro"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  frontend:
    image: finovaunt-dashboard:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NGINX_ENVSUBST_ON_TEMPLATES_DIR: /dev/null
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=4m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped